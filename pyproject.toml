[project]
name = "ldx"
version = "0.1.0"
description = "A library for modeling partially observed dynamical systems with latent ODEs and SDEs"
readme = "README.md"
authors = [
    {name = "Ahmed Elgazzar", email = "ahmed.elgazzar@example.com"}
]
license = {text = "MIT"}
keywords = ["neural-ode", "latent-dynamics", "jax", "dynamical-systems", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    # NNX API used here needs >= 0.10.7; tested up to 0.12.x. The upper bound
    # guards against future NNX API changes breaking a fresh install.
    "flax>=0.10.7,<0.13",
    "diffrax>=0.5.0",
    "optax>=0.2.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/elgazzarr/ldx"
Repository = "https://github.com/elgazzarr/ldx"
Documentation = "https://ldx.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
